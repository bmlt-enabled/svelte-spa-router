version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR rather than a dozen. CI proves the whole tree builds together, which
    # is the only signal that matters for a lockfile bump, and a single PR is a
    # single review of a single green run.
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    open-pull-requests-limit: 5
    ignore:
      # Stay on TypeScript 6.x; don't let Dependabot bump to 7.
      - dependency-name: typescript
        versions:
          - '>=7.0.0'
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: ci
